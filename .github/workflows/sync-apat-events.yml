# A Place at the Table: lives at .github/workflows/sync-apat-events.yml in
# LegacyCo/apat-events, with pco_events_sync.py at that repo's root.
#
# No secrets needed. Events come from APAT's public Church Center calendar (aptc).
# Settings → Pages → Source: "GitHub Actions"

name: Sync APAT events

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  actions: write     # for the keepalive step
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # GitHub turns off scheduled workflows in public repos after 60 days with no
      # repo activity. Re-enabling through the API restarts that clock, no commits needed.
      - name: Keep the hourly schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull APAT events from Church Center
        env:
          EVENTS_SOURCE: churchcenter
          CHURCH_CENTER_SUBDOMAIN: aptc
          PCO_TIMEZONE: America/New_York
          PCO_CALENDAR_NAME: A Place at the Table Events
          SITE_URL: https://aplaceatthetable.squarespace.com/events
          # Street addresses only for the church campus. Homes show their name; Church
          # Center still has the full address for people who register or click through.
          STREET_ADDRESSES: campus
        run: >
          python3 pco_events_sync.py --output-dir public --days-back 1825 --days-ahead 365
          --previous "https://legacyco.github.io/apat-events/events.json"

      # The Squarespace embeds load these scripts; the preview page shows all of them with live data.
      - name: Add embeds and preview page
        run: cp -r embeds preview.html public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
